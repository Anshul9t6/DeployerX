# Tamil jargon glossary — plain language for operators
# Prefer everyday Tamil customers would understand; avoid heavy English jargon.

version: 1
language: ta
language_name: Tamil
country: in
status: seeded

terms:
  - en: AI / artificial intelligence
    ta: கணினி ஸ்மார்ட் உதவி
    say: "கேள்விகளுக்கு பதில் எழுத உதவும் ஸ்மார்ட் உதவியாளர்"
    avoid: "ஆர்டிஃபிஷியல் இன்டெலிஜென்ஸ் (எடுத்துக்காட்டு இல்லாமல்)"

  - en: chatbot
    ta: தானியங்கி பதில் / WhatsApp உதவியாளர்
    say: "வாடிக்கையாளர் செய்திகளுக்கு தயார் பதில் தரும் உதவியாளர்"
    avoid: "சாட்பாட் / ஏஜென்டிக் வொர்க்ஃப்ளோ"

  - en: prompt
    ta: அறிவுறுத்தல் / உத்தரவு
    say: "போட் எப்படி பதிலளிக்க வேண்டும் என்ற தெளிவான அறிவுறுத்தல்"
    avoid: "ப்ராம்ப்ட் இன்ஜினியரிங்"

  - en: LLM / large language model
    ta: ஸ்மார்ட் எழுத்து மாடல்
    say: "ChatGPT / Claude போன்ற உரை புரிந்து எழுதும் கருவி"
    avoid: "ஃபவுண்டேஷன் மாடல்"

  - en: API
    ta: இணைப்பு
    say: "இரண்டு மென்பொருளை இணைக்கும் வழி (எ.கா. WhatsApp-ஐ AI உடன்)"
    avoid: "REST API / எண்ட்பாயிண்ட்"

  - en: hallucination
    ta: தவறான / புனைந்த பதில்
    say: "போட் தவறான விலை அல்லது பொய் தகவல் சொல்லும்போது"
    avoid: "ஹேலூசினேஷன்"

  - en: human-in-the-loop
    ta: முதலில் நீங்கள் சரிபாருங்கள்
    say: "வாடிக்கையாளருக்கு அனுப்பும் முன் உரிமையாளர் பதிலைப் பார்க்கவும்"
    avoid: "HITL"

  - en: deployment
    ta: இயக்கத்தில் வைப்பது
    say: "அமைப்பை தினசரி வேலையில் பயன்படுத்துவது"
    avoid: "புரொடக்ஷன் டிப்ளாய்மெண்ட்"

  - en: latency
    ta: பதிலில் தாமதம்
    say: "பதில் வர எவ்வளவு நேரம் ஆகும்"
    avoid: "p99 லேட்டன்சி"

  - en: token / tokens
    ta: பில்லிங் அலகு / சொல்-பகுதி
    say: "AI பயன்பாட்டின் மீட்டர் — அதிகம் படித்தால்/எழுதினால் அதிக செலவு"
    avoid: "டோக்கன் விண்டோ"

  - en: fine-tuning
    ta: சிறப்பு பயிற்சி
    say: "தொடக்கத்தில் பொதுவாக தேவையில்லை; நல்ல அறிவுறுத்தல்கள் போதும்"
    avoid: "ஃபைன்-டியூன் / LoRA"

  - en: RAG / retrieval
    ta: உங்கள் கோப்பிலிருந்து பதில்
    say: "போட் உங்கள் விலைப்பட்டியல்/FAQ படித்து பதிலளிக்கும்"
    avoid: "வெக்டர் டேட்டாபேஸ்"

  - en: on-prem
    ta: உங்கள் கணினியில் / அலுவலகத்தில்
    say: "தரவை வெளியே கிளவுடுக்கு அனுப்பாமல் — பெரும்பாலான கடைகளுக்கு இப்போது தேவையில்லை"
    avoid: "ஆன்-ப்ரெம்"

  - en: WhatsApp Business API
    ta: WhatsApp பிசினஸ் இணைப்பு (கட்டணம்)
    say: "மென்பொருள் உங்கள் பிசினஸ் எண்ணில் பதில் அனுப்ப அதிகாரப்பூர்வ வழி"
    avoid: "WABA / BSP"

  - en: UPI
    ta: UPI (போன் மூலம் பேமெண்ட்)
    say: "PhonePe / GPay / Paytm மூலம் பணம்"
    avoid: "பேமெண்ட் கேட்வே (UPI போதும் என்றால்)"

  - en: eval / evaluation
    ta: சரிபார்ப்பு பட்டியல்
    say: "மாதிரி கேள்விகளில் போட் பதில் சரியா என்று டெஸ்ட்"
    avoid: "எவல் ஹார்னெஸ்"

  - en: forward deployed engineer
    ta: இடத்திலேயே அமைப்பை இயக்கும் பொறியாளர்
    say: "வாடிக்கையாளர் இடத்திற்குச் சென்று AI அமைப்பை இயக்கும் நபர்"
    avoid: "FDE (விளக்கம் இல்லாமல்)"
