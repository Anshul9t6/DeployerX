name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate
        run: make check
      - name: Coverage report
        run: make coverage
      - name: Site data smoke
        run: make site
      - name: Resolver smoke
        run: make resolve ARGS="in uttar-pradesh varanasi"
