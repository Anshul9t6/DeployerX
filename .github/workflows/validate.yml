name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate
        run: make check
      - name: Coverage report
        run: make coverage
      - name: Site data smoke
        run: make site
      - name: Resolver smoke
        run: |
          make resolve ARGS="in uttar-pradesh varanasi"
          make resolve ARGS="in rajasthan jaipur"
      - name: Path A smoke (no TTY)
        run: |
          python3 -m decision.cli --country in --l2 rajasthan --l3 jaipur --language hi --use-case shop_faq
          printf 'Shop: CI Kirana\nHours: 8-21\nAtta 1kg: ₹45\n' > /tmp/faq.txt
          python3 -m decision.prompt whatsapp-shop-faq --faq /tmp/faq.txt --locale in/rajasthan/jaipur --lang hi --out /tmp/prompt.txt
          grep -q "CI Kirana" /tmp/prompt.txt && grep -q "jaipur/constraints.md" /tmp/prompt.txt
